<ion-content [fullscreen]="true">

  <!-- TOP BAR -->

  <div id="top">

    <!-- LEFT -->

    <div id="top-left">

      <img
        src="assets/images/logo.png"
        class="logo">

      <p id="logoname">

        HandmadeMart

      </p>

    </div>

    <!-- RIGHT -->

    <div id="top-right">

      <!-- LOGIN -->

      <ion-button
        *ngIf="!isLoggedIn"
        id="login"
        fill="clear"
        (click)="checkUser()">

        <ion-icon name="person-outline"></ion-icon>

        Login/Signup

      </ion-button>

      <!-- USER SECTION -->

      <div
        *ngIf="isLoggedIn"
        id="user-section">

        <ion-icon
          name="person-circle-outline"
          id="usericon">

        </ion-icon>

        <span id="username">

          {{username}}

        </span>

          <ion-button
    fill="clear"
    color="danger"
    (click)="logout()">

    Logout

  </ion-button>

      </div>

    </div>

  </div>

  <!-- NAVBAR -->

  <div id="nav">

    <a routerLink="/home">
      Home
    </a>

    <a routerLink="/about">
      About Us
    </a>

    <a routerLink="/categories">
      Categories
    </a>

    <a routerLink="/contact">
      Contact Us
    </a>

  </div>

  <!-- TITLE -->

  <div id="wishlist-title">

    <h1>
      My Wishlist ❤️
    </h1>

    <p>
      Your favorite handmade collections
    </p>

  </div>

  <!-- EMPTY -->

  <div
    *ngIf="wishlist.length == 0"
    id="empty-box">

    <ion-icon
      name="heart-dislike-outline">

    </ion-icon>

    <h1>
      No Wishlist Products
    </h1>

    <p>
      Your favorite products will appear here
    </p>

  </div>

  <!-- GRID -->

  <div id="wishlist-grid">

    <ion-card
      *ngFor="let item of wishlist">

      <img
        [src]="item.productimage">

      <ion-card-content>

        <h2>

          {{item.product_name}}

        </h2>

        <h3>

          ₹ {{item.product_price}}

        </h3>

        <p>

          {{item.description}}

        </p>

        <!-- BUTTONS -->

        <div class="button-section">

          <ion-button
            class="buy-btn"
            expand="block"
            routerLink="/order">

            Buy Now

          </ion-button>

          <ion-button
            class="remove-btn"
            expand="block"
            (click)="removeItem(item.id)">

            Remove

          </ion-button>

        </div>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
