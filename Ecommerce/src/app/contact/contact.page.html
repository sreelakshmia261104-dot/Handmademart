<ion-content [fullscreen]="true">
  
  <div id="top">
    <div id="top-left">
      <img src="assets/images/logo.png" class="logo">
      <p id="logoname">HandmadeMart</p>
</div>

    <div id="top-right"><br>
<!-- BEFORE LOGIN -->
<ion-button
  *ngIf="!isLoggedIn"
  id="login"
  fill="clear"
  (click)="checkUser()">

  <ion-icon name="person-outline"></ion-icon>

  Login/Signup

</ion-button>

<!-- AFTER LOGIN -->
<div *ngIf="isLoggedIn" id="user-section">

  <ion-icon
    name="person-circle-outline"
    id="usericon">

  </ion-icon>

  <span id="username">

    {{username}}

  </span>

  <ion-button
    fill="clear"
    color="danger"
    (click)="logout()">

    Logout

  </ion-button>

</div></div>
  </div>
  <div id="nav">

  <a routerLink="/home">Home</a>

  <a routerLink="/about">About Us</a>

  <!-- SHOW ONLY AFTER LOGIN -->
  <a *ngIf="isLoggedIn"
     routerLink="/categories">

     Categories

  </a>

  <a routerLink="/contact">Contact Us</a>

</div>
  <!-- Contact Information -->
  <div class="contact-container">

    <div class="info-box">

      <ion-icon name="location-outline"></ion-icon>

      <div>
        <h2>Address</h2>

        <p>
          HandmadeMart,<br>
          Thoothukudi, Tamil Nadu,<br>
          India
        </p>
      </div>

    </div>

    <div class="info-box">

      <ion-icon name="call-outline"></ion-icon>

      <div>
        <h2>Phone</h2>

        <p>
          +91 6374176166
        </p>
      </div>

    </div>

    <div class="info-box">

      <ion-icon name="mail-outline"></ion-icon>

      <div>
        <h2>Email</h2>

        <p>
          support@handmademart.com
        </p>
      </div>

    </div>

    <div class="info-box">

      <ion-icon name="time-outline"></ion-icon>

      <div>
        <h2>Working Hours</h2>

        <p>
          Monday - Saturday<br>
          9:00 AM - 7:00 PM
        </p>
      </div>

    </div>

  </div>
</ion-content>
