<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
     
    </ion-toolbar>
  </ion-header>

  <div id="top">
    <div id="top-left">
      <img src="assets/images/logo.png" class="logo">
      <p id="logoname">HandmadeMart</p>

</div>
     

<div id="top-right"><br>
<!-- BEFORE LOGIN -->
<ion-button
  *ngIf="!isLoggedIn"
  id="login"
  fill="clear"
  (click)="checkUser()">

  <ion-icon name="person-outline"></ion-icon>

  Login/Signup

</ion-button>

<!-- AFTER LOGIN -->
<div *ngIf="isLoggedIn" id="user-section">

  <ion-icon
    name="person-circle-outline"
    id="usericon">

  </ion-icon>

  <span id="username">

    {{username}}

  </span>

  <ion-button
    fill="clear"
    color="danger"
    (click)="logout()">

    Logout

  </ion-button>

</div></div>
  </div>

<div id="nav">

  <a routerLink="/home">Home</a>

  <a routerLink="/about">About Us</a>

  <!-- SHOW ONLY AFTER LOGIN -->
  <a *ngIf="isLoggedIn"
     routerLink="/categories">

     Categories

  </a>

  <a routerLink="/contact">Contact Us</a>

</div>

<div id="gallery">
  <div id="gallery-content">

    <h2>Discover the Beauty of</h2>

    <h1>HANDMADE PRODUCTS</h1>

    <p>
      Unique, Authentic & Made with Love
    </p>

    <span>
      Shop from a wide range of handmade products crafted by talented artisans around the world.
    </span>

    <button routerLink="/categories">Shop Now →</button>

  </div>
  <div id="gallery-image">

    <img id="slider" src="assets/images/decor.jpg">

  </div>

</div>
</ion-content>
